name: Terraform Plan

on:
  pull_request:
    branches:
      - main

jobs:
  plan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Run Terraform plan
        run: terraform plan -var="github_owner=${{ secrets.GITHUB_OWNER }}" -var="github_token=${{ secrets.GITHUB_TOKEN }}"
        working-directory: terraform
