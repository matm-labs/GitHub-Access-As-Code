name: Terraform Plan

on:
  pull_request:
    branches:
      - main

jobs:
  plan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
      
      - name: Initialize Terraform
        run: terraform init
        working-directory: terraform

      - name: Initialize Terraform
        run: terraform init
        working-directory: terraform
      
      - name: Run Terraform plan for teams module
        run: terraform plan -target=module.teams -var="github_owner=${{ secrets.OWNER }}" -var="github_token=${{ secrets.ORG_TOKEN }}"
        working-directory: terraform

      - name: Run Terraform plan
        run: terraform plan -var="github_owner=${{ secrets.OWNER }}" -var="github_token=${{ secrets.ORG_TOKEN }}"
        working-directory: terraform
